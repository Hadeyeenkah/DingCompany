<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0e2f34">
    <link rel="canonical" href="/">
    <title>Portal moved | Intercoastal Water LLC</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f6f3ea;
        color: #1f2b28;
        font: 400 16px/1.6 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        text-align: center;
      }
      .card {
        max-width: 420px;
        background: #fffdf8;
        border: 1px solid #ddd6c2;
        border-radius: 10px;
        padding: 32px 28px;
      }
      h1 { margin: 0 0 10px; font-size: 20px; color: #0e2f34; }
      p { margin: 0 0 20px; color: #55645d; font-size: 15px; }
      a.button {
        display: inline-block;
        background: #0e2f34;
        color: #f2efe4;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        padding: 12px 22px;
        border-radius: 6px;
      }
      a.button:focus-visible { outline: 2px solid #2fa895; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>The portal has a new address</h1>
      <p>You are being taken to the portal home page. If nothing happens, use the link below.</p>
      <a class="button" href="/">Go to the portal</a>
    </main>
    <script>
      // Redirect in script rather than with meta refresh: a meta refresh pointing
      // at "/" reloads this page forever if it is ever served at "/" itself, and
      // it also breaks the back button. This checks the path first and uses
      // replace() so the back button returns to where the visitor came from.
      (function () {
        var alreadyHome = location.pathname === '/' || location.pathname === '/index.html';
        if (!alreadyHome) location.replace('/');
      })();
    </script>
  </body>
</html>
